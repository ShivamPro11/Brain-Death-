<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRAIN DEATH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- IF YOU HAVE A SOCIAL BAR SCRIPT, PASTE IT BELOW THIS LINE -->
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&display=swap');
        :root { --primary: #14b8a6; --bg: #0f172a; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: #0f172a; 
            color: #f1f5f9; 
            overflow: hidden; 
            height: 100vh; 
            height: 100dvh; 
            margin: 0; 
            width: 100%;
        }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
        .btn-zen { background: linear-gradient(145deg, #134e4a, #0f172a); border: 1px solid var(--primary); box-shadow: 0 4px 0 #0d9488; }
        .btn-zen:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d9488; }
        #ad-layer { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; flex-direction: column; align-items: center; justify-content: center; }
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    </style>
</head>
<body class="flex flex-col w-full">

    <!-- AD OVERLAY SCREEN -->
    <div id="ad-layer">
        <div class="text-teal-400 animate-spin text-4xl mb-4"><i class="fas fa-circle-notch"></i></div>
        <div id="ad-status" class="text-white font-mono text-[10px] tracking-widest uppercase text-center px-4">Initializing Sponsored Session...</div>
        <button id="close-ad-btn" class="mt-8 px-8 py-3 glass text-xs hidden text-teal-400 font-bold border border-teal-500 uppercase tracking-widest">Resume Neural Link</button>
    </div>

    <!-- HEADER -->
    <header class="p-4 flex justify-between items-center shrink-0 w-full bg-slate-900/80 border-b border-white/5">
        <h1 class="text-xl font-extrabold italic uppercase tracking-tighter text-teal-400">BRAIN DEATH</h1>
        <div class="glass px-3 py-1 text-[10px] font-mono border border-teal-500/30">SCORE: <span id="total-score-display">0</span></div>
    </header>

    <!-- MAIN GAME AREA -->
    <main class="flex-1 relative overflow-hidden w-full h-full p-4">
        
        <!-- MENU VIEW (Grid Layout) -->
        <div id="menu-view" class="absolute inset-0 overflow-y-auto p-4 grid grid-cols-2 gap-4 content-start w-full"></div>

        <!-- GAME VIEW (Full screen inside main) -->
        <div id="game-view" class="absolute inset-0 hidden flex flex-col p-4 bg-slate-950/50 backdrop-blur-sm w-full">
            <div class="glass p-3 mb-4 flex justify-between items-center">
                <button onclick="app.requestBackMenu()" class="w-10 h-10 flex items-center justify-center text-teal-400 rounded-full bg-white/5"><i class="fas fa-chevron-left"></i></button>
                <div id="timer-display" class="font-mono font-bold text-teal-400 text-lg">0.0s</div>
            </div>
            <div id="game-canvas" class="flex-1 glass flex items-center justify-center p-4 relative overflow-hidden"></div>
            <div id="game-instruction" class="mt-4 p-2 text-center text-[10px] font-mono text-teal-500 uppercase tracking-widest"></div>
        </div>

        <!-- OVERLAY (Success/Fail) -->
        <div id="overlay" class="absolute inset-0 z-50 hidden flex items-center justify-center bg-slate-950/95 backdrop-blur-xl">
            <div class="glass p-8 max-w-sm w-full mx-4 text-center border-teal-500/20">
                <div id="overlay-icon" class="text-5xl mb-4"></div>
                <h3 id="overlay-title" class="text-xl font-bold mb-1 uppercase tracking-tight"></h3>
                <p id="overlay-msg" class="text-slate-400 text-[10px] mb-6 uppercase tracking-widest">Validating Neural Sequence...</p>
                <button id="overlay-btn" class="w-full btn-zen py-4 rounded-xl text-teal-400 font-bold uppercase tracking-widest text-sm"></button>
            </div>
        </div>
    </main>

<script>
/** * ADSTERRA INTEGRATION
 * Your Direct Link is integrated below.
 **/
const AdManager = {
    directLink: "https://www.profitablecpmratenetwork.com/aqxt7bxz?key=eb8704ec82c821716e458d5b4bc6fe09", 

    showVideoAd(callback) {
        const layer = document.getElementById('ad-layer');
        const btn = document.getElementById('close-ad-btn');
        const status = document.getElementById('ad-status');
        
        layer.style.display = 'flex';
        btn.classList.add('hidden');
        status.textContent = "ACCESSING SPONSORED DATA...";

        // Trigger Adsterra Direct Link
        try {
            window.open(this.directLink, '_blank');
        } catch(e) { console.log("Popup blocked"); }

        // Simulation delay (keeps user on ad screen for 4 seconds)
        setTimeout(() => {
            status.textContent = "SIGNAL RESTORED";
            btn.classList.remove('hidden');
            btn.onclick = () => {
                layer.style.display = 'none';
                if (callback) callback();
            };
        }, 4000); 
    }
};

class BrainDeath {
    constructor() {
        this.progress = JSON.parse(localStorage.getItem('brainDeath_v2')) || {};
        this.currentGameId = null;
        this.currentLevel = 1;
        this.timer = null;
        this.gameActive = false;
        this.init();
    }
    init() { this.renderMenu(); this.updateTotalScore(); }
    updateTotalScore() {
        let total = Object.values(this.progress).reduce((a, b) => a + (b-1), 0);
        document.getElementById('total-score-display').textContent = total;
    }
    renderMenu() {
        const menu = document.getElementById('menu-view');
        menu.innerHTML = GAMES_CONFIG.map(game => `
            <div onclick="app.selectGame('${game.id}')" class="glass p-6 flex flex-col items-center justify-center gap-3 cursor-pointer border border-teal-500/10 active:scale-95 transition-transform">
                <i class="fas ${game.icon} text-teal-400 text-3xl"></i>
                <h3 class="font-bold text-[11px] text-white uppercase text-center leading-tight">${game.name}</h3>
                <span class="text-[9px] text-teal-500/60 font-mono tracking-tighter">NODE ${this.progress[game.id] || 1}</span>
            </div>`).join('');
    }
    requestBackMenu() {
        AdManager.showVideoAd(() => {
            clearInterval(this.timer);
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('menu-view').classList.remove('hidden');
            this.renderMenu();
        });
    }
    selectGame(gameId) {
        this.currentGameId = gameId;
        this.currentLevel = this.progress[gameId] || 1;
        document.getElementById('menu-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
        this.startLevel();
    }
    showOverlay(success) {
        this.gameActive = false;
        clearInterval(this.timer);
        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        if (success) {
            document.getElementById('overlay-icon').innerHTML = '<i class="fas fa-check-circle text-teal-400"></i>';
            document.getElementById('overlay-title').textContent = "NODE COMPLETED";
            document.getElementById('overlay-btn').textContent = "NEXT CHALLENGE";
            document.getElementById('overlay-btn').onclick = () => {
                AdManager.showVideoAd(() => {
                    this.currentLevel++;
                    this.progress[this.currentGameId] = this.currentLevel;
                    localStorage.setItem('brainDeath_v2', JSON.stringify(this.progress));
                    overlay.classList.add('hidden');
                    this.startLevel();
                });
            };
        } else {
            document.getElementById('overlay-icon').innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
            document.getElementById('overlay-title').textContent = "CONNECTION LOST";
            document.getElementById('overlay-btn').textContent = "REBOOT NODE";
            document.getElementById('overlay-btn').onclick = () => { 
                overlay.classList.add('hidden'); 
                this.startLevel(); 
            };
        }
    }
    startTimer(sec, onEnd) {
        clearInterval(this.timer);
        let time = sec;
        this.timer = setInterval(() => {
            time -= 0.1;
            document.getElementById('timer-display').textContent = Math.max(0, time).toFixed(1) + 's';
            if (time <= 0) { clearInterval(this.timer); if(this.gameActive) onEnd(); }
        }, 100);
    }
    startLevel() {
        this.gameActive = true;
        const canvas = document.getElementById('game-canvas');
        canvas.innerHTML = '';
        const diff = Math.min(1, (this.currentLevel - 1) / 30);
        
        // Reflex Test Game Logic
        let taps = 8 + Math.floor(diff * 35);
        canvas.innerHTML = `
            <div class="flex flex-col items-center gap-6">
                <div class="text-[9px] text-teal-500 font-mono uppercase tracking-[0.2em] animate-pulse">Neural Input Required</div>
                <button id="target" class="w-44 h-44 glass rounded-full text-6xl font-black text-teal-400 border-2 border-teal-500/40 shadow-[0_0_30px_rgba(20,184,166,0.2)]">${taps}</button>
            </div>`;
        
        document.getElementById('target').onclick = () => {
            taps--;
            document.getElementById('target').textContent = taps;
            if(taps <= 0 && this.gameActive) this.showOverlay(true);
        };
        this.startTimer(Math.max(1.8, 6 - diff * 4), () => this.showOverlay(false));
        document.getElementById('game-instruction').textContent = "Tap fast to stabilize the connection";
    }
}

const GAMES_CONFIG = [
    { id: 'logic', name: 'Neural Logic', icon: 'fa-brain' },
    { id: 'reflex', name: 'Reflex Point', icon: 'fa-bolt' },
    { id: 'scan', name: 'Pattern Scan', icon: 'fa-fingerprint' },
    { id: 'echo', name: 'Echo Recall', icon: 'fa-wave-square' }
];

const app = new BrainDeath();
</script>
</body>
</html>
