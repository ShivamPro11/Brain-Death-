<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRAIN DEATH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Space+Mono&display=swap');
        
        :root {
            --zen-primary: #14b8a6;
            --zen-bg: #0f172a;
            --zen-card: rgba(30, 41, 59, 0.8);
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f1f5f9; 
            overflow: hidden;
            touch-action: manipulation;
            height: 100dvh;
        }

        .glass-3d {
            background: var(--zen-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        .btn-zen {
            background: linear-gradient(145deg, #134e4a, #0f172a);
            border: 1px solid var(--zen-primary);
            box-shadow: 0 4px 0 #0d9488;
        }

        .btn-zen:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0d9488;
        }

        .matrix-cell {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        
        .matrix-cell.target { 
            background: var(--zen-primary);
            box-shadow: 0 0 15px var(--zen-primary);
        }

        .text-3d {
            text-shadow: 0 2px 0 #0d9488, 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Fast Ad Alert UI */
        #ad-layer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        * { user-select: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="flex flex-col">

    <!-- 1-Second Ad Alert -->
    <div id="ad-layer">

        <div class="text-white font-mono text-[10px] tracking-[0.4em] uppercase">Neural Link Syncing...</div>
    </div>

    <header class="p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-extrabold tracking-tighter text-3d italic uppercase">BRAIN DEATH</h1>
        </div>
        <div class="glass-3d px-3 py-1 text-[10px] font-mono text-teal-400">

    <main class="flex-1 relative overflow-hidden px-4 pb-4">
        <div id="menu-view" class="absolute inset-0 overflow-y-auto p-2 grid grid-cols-2 md:grid-cols-4 gap-4 content-start pb-10"></div>

    ],
    adLayer: null,
    
    init() {
        this.adLayer = document.getElementById('ad-layer');
    },

    showAd(callback) {
        this.adLayer.style.display = 'flex';
        const randomLink = this.links[Math.floor(Math.random() * this.links.length)];
        
        // Show alert for exactly 1 second, then open ad and continue
        setTimeout(() => {
            window.open(randomLink, '_blank');
            this.adLayer.style.display = 'none';
            if (callback) callback();
        }, 1000); 
    }
};

const AudioEngine = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    osc(freq, type, vol, dur) {
        this.init();
        try {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, this.ctx.currentTime);
            g.gain.setValueAtTime(vol, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
            o.connect(g); g.connect(this.ctx.destination);
            o.start(); o.stop(this.ctx.currentTime + dur);
        } catch(e) {}
    },
    click() { this.osc(600, 'sine', 0.1, 0.1); },
    win() { this.osc(523, 'sine', 0.1, 0.3); setTimeout(()=>this.osc(659,'sine',0.1,0.3),100); },
    loss() { this.osc(120, 'sawtooth', 0.1, 0.5); },
    tick() { this.osc(1200, 'sine', 0.03, 0.05); }
};

class BrainDeath {
    constructor() {
        this.progress = JSON.parse(localStorage.getItem('brainDeathProgress_v2')) || {};
        this.sessionLevelsCompleted = 0;
        this.currentGameId = null;
        this.currentLevel = 1;
        this.timer = null;
        this.gameActive = false;
        this.init();
    }

    init() {
        AdManager.init();
        this.renderMenu();
        this.updateTotalScore();
    }

    updateTotalScore() {
        let total = Object.values(this.progress).reduce((a, b) => a + (b-1), 0);
        document.getElementById('total-score-display').textContent = total;
    }

    renderMenu() {
        const menu = document.getElementById('menu-view');
        menu.innerHTML = GAMES_CONFIG.map(game => `
            <div onclick="app.selectGame('${game.id}')" class="glass-3d p-4 flex flex-col items-center justify-center gap-2 cursor-pointer active:scale-95 transition-transform">
                <i class="fas ${game.icon} text-teal-400 text-lg"></i>
                <h3 class="font-bold text-[10px] text-white uppercase text-center">${game.name}</h3>
                <span class="text-[8px] text-teal-600 font-mono">LVL ${this.progress[game.id] || 1}</span>
            </div>`).join('');
    }

    requestBackMenu() {
        AudioEngine.click();
        AdManager.showAd(() => {
            this.showMenu();
        });
    }

    showMenu() {
        clearInterval(this.timer);
        this.gameActive = false;
        document.getElementById('game-view').classList.add('hidden');
        document.getElementById('menu-view').classList.remove('hidden');
        document.getElementById('overlay').classList.add('hidden');
        this.renderMenu();
        this.updateTotalScore();
    }

    selectGame(gameId) {
        AudioEngine.click();
        this.currentGameId = gameId;
        this.currentLevel = this.progress[gameId] || 1;
        document.getElementById('menu-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
        this.startLevel();
    }

    showOverlay(success, msg) {
        this.gameActive = false;
        clearInterval(this.timer);
        const overlay = document.getElementById('overlay');
        overlay.classList.remove('hidden');
        if (success) {
            AudioEngine.win();
            document.getElementById('overlay-icon').innerHTML = '<i class="fas fa-check-circle text-teal-400"></i>';
            document.getElementById('overlay-title').textContent = "SUCCESS";
            document.getElementById('overlay-msg').textContent = "Neural Link Stable";
            document.getElementById('overlay-btn').textContent = "NEXT NODE";
            document.getElementById('overlay-btn').onclick = () => {
                this.sessionLevelsCompleted++;
                
                // Trigger Ad every 5 successful levels
                if(this.sessionLevelsCompleted % 5 === 0) {
                    AdManager.showAd(() => this.finalizeWin());
                } else {
                    this.finalizeWin();
                }
            };
        } else {
            AudioEngine.loss();
            document.getElementById('overlay-icon').innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
            document.getElementById('overlay-title').textContent = "FAILED";
            document.getElementById('overlay-msg').textContent = msg || "Signal Lost";
            document.getElementById('overlay-btn').textContent = "REBOOT";
            document.getElementById('overlay-btn').onclick = () => { overlay.classList.add('hidden'); this.startLevel(); };
        }
    }

    finalizeWin() {
        const overlay = document.getElementById('overlay');
        this.currentLevel++;
        this.progress[this.currentGameId] = this.currentLevel;
        localStorage.setItem('brainDeathProgress_v2', JSON.stringify(this.progress));
        overlay.classList.add('hidden');
        this.startLevel();
        this.updateTotalScore();
    }

    startTimer(sec, onEnd) {
        clearInterval(this.timer);
        let time = sec;
        const display = document.getElementById('timer-display');
        this.timer = setInterval(() => {
            time -= 0.1;
            display.textContent = Math.max(0, time).toFixed(1) + 's';
            if (time < 3 && time > 0) AudioEngine.tick();
            if (time <= 0) { clearInterval(this.timer); if(this.gameActive) onEnd(); }
        }, 100);
    }

    startLevel() {
        this.gameActive = true;
        const canvas = document.getElementById('game-canvas');
        canvas.innerHTML = '';
        const diff = Math.min(1, (this.currentLevel - 1) / 40);
        
        switch(this.currentGameId) {
            case 'memory_matrix': this.gameMemoryMatrix(diff); break;
            case 'quick_math': this.gameQuickMath(diff); break;
            case 'color_match': this.gameIrisSync(diff); break;
            case 'number_order': this.gameNumberOrder(diff); break;
            case 'symbol_hunt': this.gamePatternScan(diff); break;
            case 'fast_fingers': this.gameFastFingers(diff); break;
            case 'simon_says': this.gameSimonRecall(diff); break;
            case 'even_odd': this.gameEvenOdd(diff); break;
        }
    }

    gameMemoryMatrix(diff) {
        const count = Math.floor(9 + diff * 16);
        const targetsCount = Math.floor(3 + diff * 6);
        const cols = Math.ceil(Math.sqrt(count));
        const canvas = document.getElementById('game-canvas');
        const grid = document.createElement('div');
        grid.className = "grid gap-1.5";
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        const targets = new Set();
        while(targets.size < targetsCount) targets.add(Math.floor(Math.random() * count));
        for(let i=0; i<count; i++) {
            const c = document.createElement('div');
            c.className = "w-10 h-10 matrix-cell";
            if(targets.has(i)) c.classList.add('target');
            grid.appendChild(c);
        }
        canvas.appendChild(grid);
        document.getElementById('game-instruction').textContent = "MEMORIZE";
        setTimeout(() => {
            if(!this.gameActive) return;
            grid.childNodes.forEach(c => c.classList.remove('target'));
            document.getElementById('game-instruction').textContent = "RESTORE";
            this.startTimer(5, () => this.showOverlay(false));
            let found = 0;
            grid.childNodes.forEach((c, i) => {
                c.onclick = () => {
                    AudioEngine.click();
                    if(targets.has(i)) {
                        if(!c.classList.contains('target')) { c.classList.add('target'); found++; if(found === targetsCount) this.showOverlay(true); }
                    } else this.showOverlay(false);
                };
            });
        }, 1200);
    }

    gameSimonRecall(diff) {
        const len = 3 + Math.floor(diff * 5);
        const seq = Array.from({length: len}, () => Math.floor(Math.random() * 4));
        const canvas = document.getElementById('game-canvas');
        canvas.innerHTML = `<div class="grid grid-cols-2 gap-4">${[0,1,2,3].map(i => `<div id="p${i}" class="w-20 h-20 glass-3d transition-colors"></div>`).join('')}</div>`;
        let step = 0;
        const play = () => {
            if(!this.gameActive) return;
            if(step >= len) { this.startTimer(len*2, ()=>this.showOverlay(false)); return; }
            const p = document.getElementById('p'+seq[step]);
            p.style.background = "rgba(20, 184, 166, 0.5)"; AudioEngine.tick();
            setTimeout(() => { p.style.background = ""; step++; setTimeout(play, 300); }, 400);
        };
        setTimeout(play, 800);
        let userStep = 0;
        [0,1,2,3].forEach(i => {
            document.getElementById('p'+i).onclick = () => {
                AudioEngine.click();
                if(i === seq[userStep]) { userStep++; if(userStep === len) this.showOverlay(true); }
                else { this.showOverlay(false); }
            }
        });
