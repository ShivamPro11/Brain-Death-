
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BRAIN DEATH PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Space+Mono&display=swap');
        
        :root {
            --zen-primary: #14b8a6;
            --zen-bg: #0f172a;
            --zen-card: rgba(30, 41, 59, 0.8);
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f1f5f9; 
            overflow: hidden;
            touch-action: manipulation;
            height: 100dvh;
        }

        .glass-3d {
            background: var(--zen-card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        .btn-zen {
            background: linear-gradient(145deg, #134e4a, #0f172a);
            border: 1px solid var(--zen-primary);
            box-shadow: 0 4px 0 #0d9488;
        }

        .btn-zen:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0d9488;
        }

        /* Fixed Sizing for Grids */
        .matrix-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        .matrix-cell {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            min-height: 50px; /* Ensures visible size on high level counts */
            transition: all 0.2s;
        }
        
        .matrix-cell.target { 
            background: var(--zen-primary);
            box-shadow: 0 0 15px var(--zen-primary);
        }

        .symbol-grid-container {
            max-height: 50vh;
            overflow-y: auto;
            padding: 10px;
            width: 100%;
        }

        .celebration-bg {
            background: linear-gradient(45deg, #1e293b, #134e4a, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 5s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        * { user-select: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="flex flex-col">

    <!-- Adsterra Container (Invisible) -->
    <div id="ad-container" class="hidden"></div>

    <header class="p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-extrabold tracking-tighter italic uppercase text-teal-400">BRAIN DEATH</h1>
        </div>
        <div class="glass-3d px-3 py-1 text-[10px] font-mono text-teal-400">
            TOTAL NODES: <span id="total-score-display" class="text-white">0</span>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden px-4 pb-4">
        <div id="menu-view" class="absolute inset-0 overflow-y-auto p-2 grid grid-cols-2 md:grid-cols-4 gap-4 content-start pb-20"></div>

        <div id="game-view" class="absolute inset-0 hidden flex flex-col p-2">
            <div class="glass-3d p-3 mb-4 flex justify-between items-center shrink-0">
                <button onclick="app.requestBackMenu()" class="w-8 h-8 flex items-center justify-center text-teal-400 rounded-full bg-white/5">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="flex flex-col items-center">
                    <div id="inner-level-display" class="text-[10px] font-mono text-slate-400 uppercase tracking-tighter">LVL 0 / 250</div>
                    <div id="timer-display" class="font-mono font-bold text-teal-400 text-lg">0.0s</div>
                </div>
                <div class="w-8"></div>
            </div>
            
            <div id="game-canvas" class="flex-1 glass-3d flex items-center justify-center p-4 relative overflow-hidden"></div>
            
            <div id="game-instruction" class="mt-4 p-2 text-center text-[10px] font-mono text-teal-500 uppercase tracking-widest"></div>
        </div>

        <div id="overlay" class="absolute inset-0 z-50 hidden flex items-center justify-center bg-slate-950/90 backdrop-blur-md">
            <div id="overlay-card" class="glass-3d p-8 max-w-sm w-full mx-4 text-center">
                <div id="overlay-icon" class="text-5xl mb-4"></div>
                <h3 id="overlay-title" class="text-xl font-bold mb-1"></h3>
                <p id="overlay-msg" class="text-slate-400 font-mono text-[10px] mb-6 uppercase tracking-widest whitespace-pre-line"></p>
                <button id="overlay-btn" class="w-full btn-zen py-3 rounded-xl text-teal-400 font-bold uppercase tracking-widest"></button>
            </div>
        </div>
    </main>

    levelCounter: 0,
    showAd() {
        console.log("Triggering Adsterra Ad...");

    },
    trackLevel() {
        this.levelCounter++;
        if (this.levelCounter >= 5) {
            this.showAd();
            this.levelCounter = 0;
        }
    }
};

const AudioEngine = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    osc(freq, type, vol, dur) {
        this.init();
        try {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, this.ctx.currentTime);
            g.gain.setValueAtTime(vol, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
            o.connect(g); g.connect(this.ctx.destination);
            o.start(); o.stop(this.ctx.currentTime + dur);
        } catch(e) {}
    },
    click() { this.osc(600, 'sine', 0.1, 0.1); },
    win() { this.osc(523, 'sine', 0.1, 0.3); setTimeout(()=>this.osc(659,'sine',0.1,0.3),100); },
    loss() { this.osc(120, 'sawtooth', 0.1, 0.5); },
    tick() { this.osc(1200, 'sine', 0.03, 0.05); }
};
